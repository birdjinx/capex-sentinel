name: CAPEX Sentinel Daily Update

on:
  schedule:
    # 매일 아침 6시 UTC (한국 시간 오후 3시)
    - cron: '0 6 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml pytz yfinance

      - name: Run CAPEX monitor script (거시경제 + 위험도 자동 계산)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/capex_monitor_final_with_boj.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CAPEX Sentinel Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CAPEX data $(date -u +'%Y-%m-%d %H:%M:%S UTC')" && git push)
