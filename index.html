<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0e27">
    <title>CAPEX Sentinel</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #0a0e27;
            --secondary: #151b3d;
            --gold: #d4af37;
            --red: #ff4444;
            --yellow: #ffc107;
            --green: #00d084;
            --text1: #e8eef7;
            --text2: #a8b5cc;
            --border: #2a3456;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text1);
            overflow-x: hidden;
        }

        body {
            background-attachment: fixed;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
            padding-bottom: 90px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 16px 12px;
            margin: -12px -12px 20px -12px;
        }

        .header-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        .header-sub {
            font-size: 11px;
            color: var(--text2);
            margin-top: 4px;
        }

        .card {
            background: linear-gradient(135deg, rgba(42, 52, 86, 0.4) 0%, rgba(21, 27, 61, 0.4) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
            backdrop-filter: blur(10px);
        }

        .score-box {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 14px;
        }

        .score-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            transition: all 0.4s ease;
        }

        .score-circle.safe {
            background: radial-gradient(circle, #33ff99, #00cc66);
            color: #0a0e27;
            box-shadow: 0 0 30px rgba(0, 208, 132, 0.6);
        }

        .score-circle.warning {
            background: radial-gradient(circle, #ffd966, #ffb300);
            color: #1a1a1a;
            box-shadow: 0 0 30px rgba(255, 193, 7, 0.5);
        }

        .score-circle.critical {
            background: radial-gradient(circle, #ff6666, #cc0000);
            color: white;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.6);
        }

        .score-info {
            flex: 1;
        }

        .score-label {
            font-size: 11px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .score-status {
            font-size: 16px;
            font-weight: 600;
            color: var(--text1);
            margin-bottom: 6px;
        }

        .score-desc {
            font-size: 11px;
            color: var(--text2);
            line-height: 1.5;
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .data-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 12px;
        }

        .data-label {
            font-size: 10px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .data-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text1);
            font-family: 'Courier New', monospace;
            margin-bottom: 4px;
        }

        .data-change {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-block;
        }

        .change-down {
            color: var(--red);
            background: rgba(255, 68, 68, 0.15);
        }

        .change-up {
            color: var(--green);
            background: rgba(0, 208, 132, 0.15);
        }

        .alerts-section {
            margin-bottom: 14px;
        }

        .alert-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .alert-item {
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--gold);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 11px;
            line-height: 1.6;
        }

        .alert-critical {
            border-left-color: var(--red);
            background: rgba(255, 68, 68, 0.08);
        }

        .alert-warning {
            border-left-color: var(--yellow);
            background: rgba(255, 193, 7, 0.08);
        }

        .alert-time {
            font-size: 9px;
            color: var(--text2);
            margin-top: 4px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 8px 0;
        }

        .nav-btn {
