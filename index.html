<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPEX Sentinel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0a0e27 0%, #151b3d 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e8eef7; min-height: 100vh; overflow-x: hidden; }
        .header { position: sticky; top: 0; z-index: 100; background: rgba(10, 14, 39, 0.95); border-bottom: 1px solid #2a3456; padding: 16px 12px; margin-bottom: 16px; }
        .header-content { max-width: 600px; margin: 0 auto; }
        .header h1 { font-size: 18px; font-weight: 700; color: #d4af37; letter-spacing: 0.5px; }
        .header p { font-size: 11px; color: #a8b5cc; margin-top: 4px; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 12px 100px 12px; }
        .loading { text-align: center; padding: 40px 20px; color: #a8b5cc; }

        .card { background: rgba(42, 52, 86, 0.3); border: 1px solid #2a3456; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
        .score-box { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 12px; }
        .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); }
        .score-circle.critical { background: radial-gradient(circle, #ff6666, #cc0000); color: white; box-shadow: 0 0 30px rgba(255, 68, 68, 0.6); }
        .score-circle.warning { background: radial-gradient(circle, #ffd966, #ffb300); color: #1a1a1a; box-shadow: 0 0 30px rgba(255, 193, 7, 0.5); }
        .score-circle.safe { background: radial-gradient(circle, #33ff99, #00cc66); color: #0a0e27; box-shadow: 0 0 30px rgba(0, 208, 132, 0.6); }
        .score-info h2 { font-size: 11px; color: #a8b5cc; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
        .score-info p { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .score-info span { font-size: 11px; color: #a8b5cc; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .grid-full { grid-column: 1 / -1; }

        .data-label { font-size: 10px; color: #a8b5cc; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
